name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }} --group dev
      - run: uv run --no-sync ruff check omnigent tests
      - run: uv run --no-sync ruff format --check omnigent tests
      - run: uv run --no-sync pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: omnigent-zcode-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
  real-zcode:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: actions/checkout@v4
        with:
          repository: zai-org/zcode
          ref: v3.15.1
          path: vendor-zcode
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts --child-concurrency=1
        working-directory: vendor-zcode
      - run: pnpm --filter @zcode/cli... build
        working-directory: vendor-zcode
      - run: uv sync --python 3.12 --group dev
      - run: uv run --no-sync pytest tests/test_real_zcode.py
        env:
          ZCODE_TEST_CLI: ${{ github.workspace }}/vendor-zcode/apps/zcode-cli/packages/cli/dist/zcode.cjs
          ZCODE_TEST_SOURCE: ${{ github.workspace }}/vendor-zcode
